{% extends 'base.html' %}
{% block content %}
<div class="card glass">
  <h2>Interactive Quiz</h2>
  <form method="POST" id="quizForm">
    {% for q in questions %}
      <div class="question-block">
        <p><strong>Q{{ loop.index }}.</strong> {{ q.question }}</p>
        <div class="options">
          {% for opt in q.options %}
            <label>
              <input type="radio" name="q_{{ q.id }}" value="{{ opt }}" required>
              {{ opt }}
            </label>
          {% endfor %}
        </div>
      </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Submit Quiz</button>
  </form>
</div>
{% endblock %}
