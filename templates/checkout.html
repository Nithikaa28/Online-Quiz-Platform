<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="navbar sticky">
    <a class="brand" href="/">Sarab FoodHub</a>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/cart">Cart</a>
      <a href="/checkout">Checkout</a>
      <button class="theme-toggle" id="themeToggle" type="button">🌙</button>
    </nav>
  </header>

  <main class="section">
    <h1>Checkout</h1>
    <div class="grid two-col checkout-grid">
      <section class="panel">
        <h2>Customer Information</h2>
        <form id="checkoutForm" class="form-grid">
          <input type="text" name="name" placeholder="Full Name" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="tel" name="phone" placeholder="Phone Number" required>
          <textarea name="address" rows="4" placeholder="Delivery Address" required></textarea>
          <button class="btn btn-primary" type="submit">Place Order</button>
        </form>
        <p class="success-message" id="orderSuccess"></p>
      </section>

      <section class="panel">
        <h2>Order Summary</h2>
        <div id="checkoutSummary"></div>
        <h3>Total: ₹<span id="checkoutTotal">0</span></h3>
      </section>
    </div>
  </main>

  <footer class="footer"><p>© 2026 Sarab FoodHub</p></footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
