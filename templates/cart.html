<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="navbar sticky">
    <a class="brand" href="/">Sarab FoodHub</a>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/cart">Cart</a>
      <a href="/checkout">Checkout</a>
      <button class="theme-toggle" id="themeToggle" type="button">🌙</button>
    </nav>
  </header>

  <main class="section">
    <h1>Your Cart</h1>
    <p class="muted">Review your items, update quantities, and continue to checkout.</p>

    <div id="cartContainer" class="cart-list"></div>

    <div class="cart-summary">
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <a class="btn btn-primary" href="/checkout">Proceed to Checkout</a>
    </div>
  </main>

  <footer class="footer"><p>© 2026 Sarab FoodHub</p></footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
